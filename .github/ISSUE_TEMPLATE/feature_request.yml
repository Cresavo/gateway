name: Feature request
description: Suggest a change to the gateway.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do, and what stops you today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "How should it work? Note: booking logic, consent and data belong in Cresavo, not the gateway." }
  - type: textarea
    id: security
    attributes: { label: Security impact, description: Does it touch auth, rate limits, forwarding or customer data? }
