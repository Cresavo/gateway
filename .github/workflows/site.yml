name: Site
on:
  push:
    paths: ["site/**", "openapi.yaml", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "openapi.yaml", ".github/workflows/site.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- public/openapi.yaml
